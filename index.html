<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Thth</title>
  <style>
    :root {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #111;
      background: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 560px);
      border: 1px solid #111;
      padding: clamp(20px, 5vw, 40px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.4rem, 5vw, 2rem);
      line-height: 1.2;
    }

    p { line-height: 1.5; }

    .intro { margin: 0 0 32px; }

    .output {
      position: relative;
      min-height: 96px;
      display: flex;
      align-items: center;
      overflow-wrap: anywhere;
      border: 1px solid #111;
      padding: 16px 80px 16px 16px;
      font-size: clamp(1rem, 4vw, 1.4rem);
      font-weight: bold;
    }

    button {
      border: 1px solid #111;
      border-radius: 0;
      background: #fff;
      color: #111;
      font: inherit;
      font-weight: bold;
      padding: 12px;
    }

    :focus-visible { outline: 2px solid #111; outline-offset: 3px; }

    button:not(:disabled) { cursor: pointer; }
    button:not(:disabled):hover { background: #111; color: #fff; }
    button:disabled { color: #666; border-color: #999; cursor: not-allowed; }

    #copy {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 6px 8px;
      font-size: 0.75rem;
    }

    #generate { width: 100%; margin-top: 24px; }
    .feedback { min-height: 1.5em; margin: 12px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>Thth</h1>
    <p class="intro">receive thy name</p>

    <div class="output">
      <span id="name-output" aria-live="polite">Your name will appear here.</span>
      <button id="copy" type="button" disabled aria-label="Copy name">Copy</button>
    </div>

    <button id="generate" type="button" disabled>Generate</button>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
