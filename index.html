<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Thth</title>
  <script id="theme">
    (() => {
      const root = document.documentElement;
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
      let preference = null;
      try {
        const saved = localStorage.getItem('thth-theme');
        if (saved === 'light' || saved === 'dark') preference = saved;
      } catch {
        // Storage may be blocked; system preference still works.
      }

      function applyTheme() {
        const theme = preference || (systemTheme.matches ? 'dark' : 'light');
        root.dataset.theme = theme;
        const toggle = document.getElementById('theme-toggle');
        if (toggle) toggle.setAttribute('aria-pressed', String(theme === 'dark'));
      }

      applyTheme();
      systemTheme.addEventListener('change', applyTheme);
      document.addEventListener('DOMContentLoaded', () => {
        const toggle = document.getElementById('theme-toggle');
        applyTheme();
        toggle.disabled = false;
        toggle.addEventListener('click', () => {
          preference = root.dataset.theme === 'dark' ? 'light' : 'dark';
          applyTheme();
          try {
            localStorage.setItem('thth-theme', preference);
          } catch {
            // Keep the choice for this page when persistence is unavailable.
          }
        });
      });
    })();
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --background: #fff;
      --foreground: #111;
      --disabled-text: #666;
      --disabled-border: #999;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--foreground);
      background: var(--background);
    }

    :root[data-theme="light"] { color-scheme: light; }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #111;
      --foreground: #eee;
      --disabled-text: #aaa;
      --disabled-border: #666;
    }

    .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }

    #theme-toggle { padding: 6px 8px; font-size: 0.75rem; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 560px);
      border: 1px solid var(--foreground);
      padding: clamp(20px, 5vw, 40px);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 5vw, 2rem);
      line-height: 1.2;
    }

    p { line-height: 1.5; }

    .intro { margin: 0 0 32px; }

    .output {
      position: relative;
      min-height: 96px;
      display: flex;
      align-items: center;
      overflow-wrap: anywhere;
      border: 1px solid var(--foreground);
      padding: 16px 80px 16px 16px;
      font-size: clamp(1rem, 4vw, 1.4rem);
      font-weight: bold;
    }

    button {
      border: 1px solid var(--foreground);
      border-radius: 0;
      background: var(--background);
      color: var(--foreground);
      font: inherit;
      font-weight: bold;
      padding: 12px;
    }

    :focus-visible { outline: 2px solid var(--foreground); outline-offset: 3px; }

    button:not(:disabled) { cursor: pointer; }
    button:not(:disabled):hover { background: var(--foreground); color: var(--background); }
    button:disabled { color: var(--disabled-text); border-color: var(--disabled-border); cursor: not-allowed; }

    #copy {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 6px 8px;
      font-size: 0.75rem;
    }

    #generate { width: 100%; margin-top: 24px; }
    .feedback { min-height: 1.5em; margin: 12px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="heading">
      <h1>Thth</h1>
      <button id="theme-toggle" type="button" aria-pressed="false" disabled>Dark mode</button>
    </div>
    <p class="intro">receive thy name</p>

    <div class="output">
      <span id="name-output" aria-live="polite">Your name will appear here.</span>
      <button id="copy" type="button" disabled aria-label="Copy name">Copy</button>
    </div>

    <button id="generate" type="button" disabled>Generate</button>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
  </main>

  <script id="generator">
    'use strict';

    const wordPools = JSON.parse(document.getElementById('word-pools').textContent);
    // Shared names across categories must not get extra weight.
    const words = [...new Set(Object.values(wordPools).flat())];

    function generateName(random = Math.random) {
      const wordCount = random() < 0.5 ? 2 : 3;
      const available = [...words];
      const parts = [];

      for (let i = 0; i < wordCount; i++) {
        const index = Math.floor(random() * available.length);
        parts.push(available.splice(index, 1)[0]);
      }

      if (random() < 0.5) {
        const digits = 2 + Math.floor(random() * 4);
        const minimum = 10 ** (digits - 1);
        const number = minimum + Math.floor(random() * minimum * 9);
        parts.push(String(number));
      }

      return parts.join('-');
    }

    const output = document.getElementById('name-output');
    const generateButton = document.getElementById('generate');
    const copyButton = document.getElementById('copy');
    const feedback = document.getElementById('feedback');
    let feedbackTimer;
    let generation = 0;
    let copyPending = false;

    function clearFeedback() {
      clearTimeout(feedbackTimer);
      feedback.textContent = '';
    }

    function showFeedback(message, duration = 2000) {
      clearFeedback();
      feedback.textContent = message;
      feedbackTimer = setTimeout(() => { feedback.textContent = ''; }, duration);
    }

    generateButton.addEventListener('click', () => {
      output.textContent = generateName();
      generation++;
      clearFeedback();
      copyButton.disabled = copyPending;
    });

    copyButton.addEventListener('click', async () => {
      if (generation === 0 || copyPending) return;
      clearFeedback();

      if (!navigator.clipboard || !navigator.clipboard.writeText) {
        showFeedback('Clipboard unavailable. Select name and copy manually.', 6000);
        return;
      }

      const copiedGeneration = generation;
      const name = output.textContent;
      copyPending = true;
      copyButton.disabled = true;
      try {
        await navigator.clipboard.writeText(name);
        if (generation === copiedGeneration) showFeedback('Copied!');
      } catch {
        if (generation === copiedGeneration) {
          showFeedback('Could not copy. Select name and copy manually.', 6000);
        }
      } finally {
        copyPending = false;
        copyButton.disabled = false;
      }
    });

    generateButton.disabled = false;
  </script>
